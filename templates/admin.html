<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 급식 시스템 - 관리자 페이지</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 700px;
            margin: 0 auto;
            background: #34495e;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            border-bottom: 2px solid #1abc9c;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        button {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }
        button:hover {
            background-color: #16a085;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>급식 관리자 대시보드</h1>
        
        <form id="admin-form">
            <div class="form-group">
                <label for="status">급식 진행 상태 변경</label>
                <select id="status" name="status">
                    <option value="배식 준비 중">배식 준비 중</option>
                    <option value="배식 진행 중">배식 진행 중</option>
                    <option value="배식 종료">배식 종료</option>
                </select>
            </div>

            <div class="form-group">
                <label for="menu">오늘의 식단 입력 (쉼표로 구분)</label>
                <input type="text" id="menu" name="menu" placeholder="예: 현미밥, 된장찌개, 제육볶음, 김치">
            </div>

            <button type="submit">상태 및 식단 업데이트</button>
        </form>

        <div id="result-msg" style="margin-top: 15px; color: #2ecc71;"></div>
    </div>

    <script>
        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const status = document.getElementById('status').value;
            const menuInput = document.getElementById('menu').value;
            const menu = menuInput.split(',').map(item => item.trim());

            try {
                const response = await fetch('/admin/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status, menu })
                });

                if (response.ok) {
                    document.getElementById('result-msg').innerText = '성공적으로 업데이트되었습니다!';
                } else {
                    document.getElementById('result-msg').innerText = '업데이트에 실패했습니다.';
                }
            } catch (error) {
                console.error('오류 발생:', error);
                document.getElementById('result-msg').innerText = '서버 통신 오류가 발생했습니다.';
            }
        });
    </script>
</body>
</html>
