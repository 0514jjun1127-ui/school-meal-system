<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 급식 시스템 - 학생용</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .status-box {
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            background-color: #e8f4f8;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .menu-list {
            text-align: left;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>급식 실시간 현황</h1>
        
        <div class="status-box">
            현재 상태: <span id="status-text">불러오는 중...</span>
        </div>

        <div class="menu-list">
            <h3>오늘의 메뉴</h3>
            <ul id="menu-items">
                <li>메뉴 정보를 불러오는 중입니다.</li>
            </ul>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/get_status');
                if (!response.ok) throw new Error('네트워크 응답 이상');
                const data = await response.json();

                document.getElementById('status-text').innerText = data.status || '대기 중';
                
                if (data.menu && Array.isArray(data.menu)) {
                    const menuUl = document.getElementById('menu-items');
                    menuUl.innerHTML = '';
                    data.menu.forEach(item => {
                        const li = document.createElement('li');
                        li.innerText = item;
                        menuUl.appendChild(li);
                    });
                }
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('status-text').innerText = '상태 불러오기 실패';
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 3000);
    </script>
</body>
</html>
